let viewMode='grid';function render(){const q=($('searchmode')?.value==='global'?'':$('search').value.toLowerCase()),t=$('type').value,sort=$('sort').value,from=$('from').value,to=$('to').value;let list=all.filter(i=>(i.name.toLowerCase().includes(q)||i.path.toLowerCase().includes(q))&&(!t||(!i.folder&&category(i)===t))&&(!from||i.modified?.slice(0,10)>=from)&&(!to||i.modified?.slice(0,10)<=to));list.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='size'?(b.size||0)-(a.size||0):sort==='oldest'?new Date(a.modified||0)-new Date(b.modified||0):new Date(b.modified||0)-new Date(a.modified||0));$('files').className=viewMode==='list'?'listmode':'grid';$('files').replaceChildren();$('filecount').textContent=list.length+' items';if(!list.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<div style="font-size:38px">▤</div><strong>Nothing here yet</strong><span>Upload a file or try adjusting your search.</span>';$('files').append(e)}for(const item of list){const tile=document.createElement('div');tile.className='tile';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=type(item);const name=document.createElement('div');name.className='name';name.textContent=item.name;const meta=document.createElement('small');meta.textContent=item.folder?'Folder':bytes(item.size)+' · '+(item.modified||'').slice(0,10)+(item.taken_at?' · Taken '+item.taken_at:'')+(item.distance_km!==undefined?' · '+item.distance_km+' km':'');const actions=document.createElement('div');actions.className='actions';const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)};if(item.folder){add('Open',()=>navigate(item.path))}else{if(/\.(jpg|jpeg|png|webp|gif|pdf)$/i.test(item.name))add('Preview',async()=>{try{const d=await api('preview-url?path='+encodeURIComponent(item.path));window.open(d.url,'_blank','noopener,noreferrer')}catch(e){note(e.message)}});add('Download',async()=>{try{const d=await api('download-url?path='+encodeURIComponent(item.path));location.href=d.url}catch(e){note(e.message)}})}add('Rename',async()=>{const name=prompt('New name',item.name);if(!name||name===item.name)return;const path=(item.path.includes('/')?item.path.slice(0,item.path.lastIndexOf('/')+1):'')+name;try{await post('move',{source:item.path,destination:path});await load()}catch(e){note(e.message)}});add('Delete',async()=>{if(!confirm('Delete '+item.name+'? This cannot be undone.'))return;try{await post('delete',{path:item.path});await load()}catch(e){note(e.message)}});const more=document.createElement('button');more.className='moreactions';more.textContent='⋮';more.title='File actions';more.onclick=(event)=>{event.stopPropagation();showFileActions(item,actions)};actions.append(more);tile.append(symbol,name,meta,actions);$('files').append(tile)}$('more').replaceChildren();if(cursor){const b=document.createElement('button');b.textContent='Load more';b.onclick=()=>load(true);$('more').append(b)}}
function crumbs(){const root=document.createElement('button');root.textContent='My Drive';root.onclick=()=>navigate('');$('crumbs').replaceChildren(root);let p='';for(const part of folder.split('/').filter(Boolean)){p+=(p?'/':'')+part;const dest=p;const span=document.createElement('span');span.textContent=' / ';const b=document.createElement('button');b.textContent=part;b.onclick=()=>navigate(dest);$('crumbs').append(span,b)}}
async function load(more=false){if(loading)return;loading=true;try{const d=await api('files?prefix='+encodeURIComponent(folder)+(more&&cursor?'&cursor='+encodeURIComponent(cursor):''));all=more?all.concat(d.items):d.items;cursor=d.next_cursor||'';render();crumbs();note('')}catch(e){note(e.message)}finally{loading=false}}
function navigate(p){folder=p;all=[];cursor='';$('pagetitle').textContent=p?p.split('/').pop():'My Drive';load()}
$('globalsearch').onclick=async()=>{try{note('Searching entire drive…');const params=new URLSearchParams({q:$('search').value,kind:$('type').value,start:$('from').value,end:$('to').value});if($('latitude').value&&$('longitude').value){params.set('lat',$('latitude').value);params.set('lon',$('longitude').value);params.set('radius_km',$('radius').value||'50')}if($('exif').checked)params.set('exif','true');const d=await api('search?'+params.toString());all=d.items;cursor='';folder='';$('pagetitle').textContent='Search results';render();$('crumbs').textContent='Entire drive search';note(d.truncated?'Results limited; narrow your search':'Found '+d.items.length+' matching files')}catch(e){note(e.message)}};
async function start(){const s=await api('status');$('login').style.display=s.authenticated?'none':'block';$('sidebar').style.display=s.authenticated?'flex':'none';$('app').style.display=s.authenticated?'block':'none';$('logout').style.display=s.authenticated?'block':'none';$('mobilebottom').style.display=s.authenticated?'':'none';$('mobileadd').style.display=s.authenticated?'':'none';if(s.authenticated)await load();if(!s.configured)$('loginerror').textContent='Storage needs configuration by the site owner.'}
$('loginform').onsubmit=async e=>{e.preventDefault();try{await post('login',{password:$('password').value,remember:$('rememberdevice').checked});$('password').value='';$('loginerror').textContent='';await start()}catch(err){$('loginerror').textContent=err.message}};
$('logout').onclick=async()=>{await post('logout',{});location.reload()};
$('uploadbutton').onclick=()=>$('upload').click();
$('upload').onchange=async()=>{for(const f of $('upload').files){try{note('Uploading '+f.name+'…');const path=(folder?folder+'/':'')+f.name;const form=new FormData();form.append('path',path);form.append('file',f);const response=await fetch('/storage/api/upload',{method:'POST',credentials:'same-origin',body:form});if(!response.ok){const d=await response.json().catch(()=>({}));throw Error(d.detail||'Upload failed: '+response.status)}note('Uploaded '+f.name)}catch(e){note(e.message);break}}$('upload').value='';await load()};
$('newfolder').onclick=async()=>{const name=prompt('Folder name');if(!name)return;try{await post('folder',{path:(folder?folder+'/':'')+name});await load()}catch(e){note(e.message)}};
for(const id of ['type','sort','from','to'])$(id).addEventListener('input',render);

lay='none';$('sideinstall').style.display='none'}else alert('Use your browser menu and choose Install app or Add to Home screen.')} $('installapp').onclick=installDrive;$('sideinstall').onclick=installDrive;if('serviceWorker' in navigator)navigator.serviceWorker.register('/storage/sw.js',{scope:'/storage/'}).catch(()=>{});start().catch(e=>$('loginerror').textContent=e.message);
</script></body></html>
