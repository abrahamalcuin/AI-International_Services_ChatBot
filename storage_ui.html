<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Drive</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#192335;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9dfea;background:white;border-radius:9px;padding:10px 13px;color:#23324a}button:hover{background:#f0f4fa}.primary{background:#2457cf;color:white;border-color:#2457cf}.primary:hover{background:#1646bb}header{display:flex;gap:16px;align-items:center;padding:18px 24px;background:white;border-bottom:1px solid #e5e9f1}header strong{font-size:20px}main{max-width:1300px;margin:0 auto;padding:25px}#login{max-width:380px;margin:12vh auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #20305016}#login input{width:100%;padding:12px;margin:12px 0;border:1px solid #cdd5e3;border-radius:9px}#app{display:none}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid #d7dce7;border-radius:9px;padding:10px;background:white}#search{flex:1;min-width:180px}.breadcrumbs{margin:16px 0;display:flex;gap:6px;flex-wrap:wrap}.breadcrumbs button{border:0;background:none;padding:5px;color:#2457cf}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:13px}.tile{background:white;border:1px solid #e4e8ef;border-radius:12px;padding:16px;min-height:130px;display:flex;flex-direction:column;gap:9px}.tile .symbol{font-size:32px}.tile .name{overflow-wrap:anywhere;font-weight:600}.tile small{color:#68768a}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:12px;padding:6px 8px}.empty{color:#66748b;padding:45px;text-align:center;border:2px dashed #dce2ed;border-radius:14px}#notice{min-height:24px;color:#a52c32}.drop{outline:3px dashed #2457cf;outline-offset:-12px}#upload{display:none}@media(max-width:600px){main{padding:14px}header{padding:12px}header strong{font-size:16px}.toolbar>*{flex:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:12px}}
</style></head><body><header><strong>Al's Private Drive</strong><span style="color:#69778c">Personal cloud storage</span><button id="logout" style="margin-left:auto;display:none">Sign out</button></header>
<section id="login"><h2>Private storage</h2><p>Sign in to access your files.</p><form id="loginform"><input type="password" id="password" placeholder="Drive password" autocomplete="current-password" required><button class="primary" style="width:100%">Unlock drive</button></form><p id="loginerror" role="alert"></p></section>
<main id="app"><div class="toolbar"><button class="primary" id="uploadbutton">+ Upload files</button><button id="newfolder">+ New folder</button><input id="search" placeholder="Search files by name…" aria-label="Search files"><select id="type" aria-label="File type"><option value="">All types</option><option value="image">Images</option><option value="video">Videos</option><option value="document">Documents</option><option value="other">Other</option></select><select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="name">Name</option><option value="size">Size</option></select><input id="from" type="date" title="From date"><input id="to" type="date" title="To date"><button id="clear">Clear filters</button></div><input type="file" id="upload" multiple><div class="breadcrumbs" id="crumbs"></div><p id="notice" role="status"></p><div id="files" class="grid"></div><div id="more"></div></main>
<script>
let folder='',all=[],cursor='',loading=false;const $=id=>document.getElementById(id);
const api=async(path,options={})=>{const r=await fetch('/storage/api/'+path,{credentials:'same-origin',...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Request failed');return data};
const post=(path,obj)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
const note=s=>$('notice').textContent=s;
const bytes=n=>n===undefined?'':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const type=i=>i.folder?'📁':/\.(png|jpe?g|webp|gif|heic)$/i.test(i.name)?'🖼️':/\.(mp4|mov|webm)$/i.test(i.name)?'🎬':/\.pdf$/i.test(i.name)?'📄':'📦';
const category=i=>/\.(png|jpe?g|webp|gif|heic)$/i.test(i.name)?'image':/\.(mp4|mov|webm)$/i.test(i.name)?'video':/\.(pdf|txt|docx?|xlsx?|csv|pptx?)$/i.test(i.name)?'document':'other';
function render(){const q=$('search').value.toLowerCase(),t=$('type').value,sort=$('sort').value,from=$('from').value,to=$('to').value;let list=all.filter(i=>i.name.toLowerCase().includes(q)&&(!t||(!i.folder&&category(i)===t))&&(!from||i.modified?.slice(0,10)>=from)&&(!to||i.modified?.slice(0,10)<=to));list.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='size'?(b.size||0)-(a.size||0):sort==='oldest'?new Date(a.modified||0)-new Date(b.modified||0):new Date(b.modified||0)-new Date(a.modified||0));$('files').replaceChildren();if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No matching files in this folder';$('files').append(e)}for(const item of list){const tile=document.createElement('div');tile.className='tile';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=type(item);const name=document.createElement('div');name.className='name';name.textContent=item.name;const meta=document.createElement('small');meta.textContent=item.folder?'Folder':bytes(item.size)+' · '+(item.modified||'').slice(0,10);const actions=document.createElement('div');actions.className='actions';const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)};if(item.folder){add('Open',()=>navigate(item.path))}else{add('Download',async()=>{try{const d=await api('download-url?path='+encodeURIComponent(item.path));location.href=d.url}catch(e){note(e.message)}})}add('Rename',async()=>{const name=prompt('New name',item.name);if(!name||name===item.name)return;const path=(folder?folder+'/':'')+name;try{await post('move',{source:item.path,destination:path});await load()}catch(e){note(e.message)}});add('Delete',async()=>{if(!confirm('Delete '+item.name+'? This cannot be undone.'))return;try{await post('delete',{path:item.path});await load()}catch(e){note(e.message)}});tile.append(symbol,name,meta,actions);$('files').append(tile)}$('more').replaceChildren();if(cursor){const b=document.createElement('button');b.textContent='Load more';b.onclick=()=>load(true);$('more').append(b)}}
function crumbs(){const root=document.createElement('button');root.textContent='My Drive';root.onclick=()=>navigate('');$('crumbs').replaceChildren(root);let p='';for(const part of folder.split('/').filter(Boolean)){p+=(p?'/':'')+part;const dest=p;const span=document.createElement('span');span.textContent=' / ';const b=document.createElement('button');b.textContent=part;b.onclick=()=>navigate(dest);$('crumbs').append(span,b)}}
async function load(more=false){if(loading)return;loading=true;try{const d=await api('files?prefix='+encodeURIComponent(folder)+(more&&cursor?'&cursor='+encodeURIComponent(cursor):''));all=more?all.concat(d.items):d.items;cursor=d.next_cursor||'';render();crumbs();note('')}catch(e){note(e.message)}finally{loading=false}}
function navigate(p){folder=p;all=[];cursor='';load()}
async function start(){const s=await api('status');$('login').style.display=s.authenticated?'none':'block';$('app').style.display=s.authenticated?'block':'none';$('logout').style.display=s.authenticated?'block':'none';if(s.authenticated)await load();if(!s.configured)$('loginerror').textContent='Storage needs configuration by the site owner.'}
$('loginform').onsubmit=async e=>{e.preventDefault();try{await post('login',{password:$('password').value});$('password').value='';$('loginerror').textContent='';await start()}catch(err){$('loginerror').textContent=err.message}};
$('logout').onclick=async()=>{await post('logout',{});location.reload()};
$('uploadbutton').onclick=()=>$('upload').click();
$('upload').onchange=async()=>{for(const f of $('upload').files){try{note('Uploading '+f.name+'…');const path=(folder?folder+'/':'')+f.name;const form=new FormData();form.append('path',path);form.append('file',f);const response=await fetch('/storage/api/upload',{method:'POST',credentials:'same-origin',body:form});if(!response.ok){const d=await response.json().catch(()=>({}));throw Error(d.detail||'Upload failed: '+response.status)}note('Uploaded '+f.name)}catch(e){note(e.message);break}}$('upload').value='';await load()};
$('newfolder').onclick=async()=>{const name=prompt('Folder name');if(!name)return;try{await post('folder',{path:(folder?folder+'/':'')+name});await load()}catch(e){note(e.message)}};
for(const id of ['search','type','sort','from','to'])$(id).addEventListener('input',render);
$('clear').onclick=()=>{for(const id of ['search','from','to','type'])$(id).value='';render()};
document.addEventListener('dragover',e=>{e.preventDefault();$('app').classList.add('drop')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('app').classList.remove('drop')});document.addEventListener('drop',e=>{e.preventDefault();$('app').classList.remove('drop');if(!$('app').offsetParent)return;const dt=new DataTransfer();for(const f of e.dataTransfer.files)dt.items.add(f);$('upload').files=dt.files;$('upload').dispatchEvent(new Event('change'))});
start().catch(e=>$('loginerror').textContent=e.message);
</script></body></html>
