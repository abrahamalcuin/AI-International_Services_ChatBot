<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Drive</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17243b;background:#f7f9fc;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a7c6ff;outline-offset:2px}button:hover{background:#e9eef8}.primary{background:#2365d8;color:#fff;border-radius:11px;font-weight:650}.primary:hover{background:#1753c1}.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:76px minmax(calc(100vh - 76px),auto);min-height:100vh}.top{grid-column:1/-1;display:flex;align-items:center;gap:25px;padding:0 28px;background:#fff;border-bottom:1px solid #e7ecf4}.brand{display:flex;align-items:center;gap:12px;min-width:220px;font-size:19px;font-weight:760;letter-spacing:-.6px}.brandmark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#e9f1ff;color:#2365d8;font-size:23px}.topsearch{display:flex;align-items:center;gap:10px;flex:1;max-width:760px;background:#f1f4fa;border:1px solid #e9edf5;border-radius:14px;padding:5px 12px}.topsearch:focus-within{background:#fff;border-color:#93b7fa}.topsearch input{flex:1;min-width:0;border:0;background:none;padding:11px 4px;outline:0}.topsearch button{padding:8px 13px;border-radius:9px}.topright{margin-left:auto;display:flex;align-items:center;gap:12px;color:#617087}.topright button{border:1px solid #e4e9f1;border-radius:10px;padding:9px 13px}.sidebar{background:#fff;border-right:1px solid #e8ecf4;padding:24px 15px;display:flex;flex-direction:column;gap:16px}.newbutton{padding:15px 17px;width:100%;text-align:left;box-shadow:0 3px 12px #193c7014}.navgroup{display:flex;flex-direction:column;gap:5px}.navgroup button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 14px;border-radius:11px;color:#53627b;font-weight:560}.navgroup button.active{background:#e9f1ff;color:#1c5fc9;font-weight:750}.navgroup .symbol{font-size:19px;width:22px;text-align:center}.sidefoot{margin-top:auto;padding:16px 13px;border-top:1px solid #edf0f5;color:#7c899b;font-size:12px;line-height:1.8}.workspace{min-width:0;padding:32px 38px 70px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{color:#8190a6;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:1.4px}.heading h1{font-size:30px;letter-spacing:-1.1px;margin:8px 0 8px;font-weight:760}.subtitle{color:#8290a4}.head-actions{display:flex;gap:9px;align-items:center}.outline{border:1px solid #dce3ef;background:#fff;border-radius:10px;padding:11px 15px;font-weight:600}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px}.toolbar select,.toolbar input{border:1px solid #e1e7f0;background:#fff;border-radius:10px;padding:10px 12px;min-height:39px;max-width:180px}.toolbar .view{margin-left:auto;display:flex;background:#edf1f7;border-radius:10px;padding:3px}.view button{border-radius:8px;padding:7px 12px}.view button.active{background:#fff;box-shadow:0 1px 5px #2031501a}.breadcrumbs{display:flex;gap:7px;align-items:center;margin-bottom:17px;flex-wrap:wrap;color:#7c8aa0}.breadcrumbs button{color:#4773b9;font-weight:600;padding:6px;border-radius:6px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 13px}.sectionhead h2{font-size:16px;letter-spacing:-.25px;margin:0}.sectionhead small{color:#8995a7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}.tile{border:1px solid #e5eaf2;background:#fff;border-radius:15px;padding:17px;display:flex;flex-direction:column;gap:11px;min-height:154px;transition:box-shadow .15s,border-color .15s}.tile:hover{border-color:#b9ccef;box-shadow:0 7px 22px #294b7810}.tile .symbol{font-size:31px;display:flex;align-items:center;justify-content:center;width:49px;height:49px;border-radius:13px;background:#f0f5fd}.tile .name{font-weight:650;overflow-wrap:anywhere;line-height:1.4}.tile small{font-size:12px;color:#8a96a8}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:12px;color:#4c6896;border-radius:7px;padding:6px 8px}.empty{grid-column:1/-1;text-align:center;padding:72px 20px;border:1px dashed #d4deeb;border-radius:16px;background:#fff;color:#8592a5}.empty strong{display:block;color:#344563;font-size:17px;margin:13px 0 7px}.listmode{display:flex;flex-direction:column;gap:0;border:1px solid #e6ebf3;background:#fff;border-radius:14px;overflow:hidden}.listmode .tile{border:0;border-radius:0;min-height:64px;padding:10px 17px;display:grid;grid-template-columns:44px minmax(150px,1fr) 160px 240px;align-items:center;gap:13px;border-bottom:1px solid #edf0f5}.listmode .tile:last-child{border-bottom:0}.listmode .tile .symbol{font-size:22px;width:38px;height:38px;border-radius:9px}.listmode .actions{margin:0;justify-content:flex-end}.listmode .tile small{font-size:12px}.listmode .empty{border:0}#notice{min-height:25px;color:#536f9b;font-size:13px}#more{margin-top:20px}#more button{background:#fff;border:1px solid #dce3ef;border-radius:10px;padding:11px 18px}#upload{display:none}.drop{outline:3px dashed #4185ee;outline-offset:-9px}#login{max-width:430px;margin:11vh auto;padding:40px;background:#fff;border:1px solid #e7ebf2;border-radius:20px;box-shadow:0 20px 65px #1c315412}#login h2{font-size:27px;letter-spacing:-.8px;margin:15px 0 8px}#login p{color:#77859b}#login input{width:100%;border:1px solid #d9e1ed;border-radius:11px;padding:14px;margin:15px 0}#login button{width:100%;padding:14px}.advanced{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;padding:14px;border:1px solid #e6ebf3;border-radius:12px;margin-bottom:18px}.advanced.show{display:flex}.advanced input{min-height:38px;max-width:145px;border:1px solid #e1e7f0;border-radius:8px;padding:9px}.advanced label{font-size:12px;color:#73839b}.advanced label input{vertical-align:middle}.mobilemenu{display:none}@media(max-width:950px){.shell{grid-template-columns:195px minmax(0,1fr)}.workspace{padding:25px 22px}.brand{min-width:160px}.listmode .tile{grid-template-columns:40px minmax(100px,1fr) 90px}.listmode .actions{grid-column:2/-1;justify-content:flex-start}.top{padding:0 18px;gap:12px}}@media(max-width:680px){.shell{display:block}.top{height:69px;padding:0 13px}.brand{min-width:0;font-size:16px}.brandmark{width:32px;height:32px;font-size:19px}.topsearch{gap:3px;padding:2px 5px}.topsearch input{padding:9px 2px;font-size:12px}.topsearch button{padding:6px}.topright{display:none}.sidebar{display:none}.workspace{padding:24px 15px}.heading h1{font-size:25px}.head-actions .outline{padding:10px}.toolbar select{max-width:140px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:13px;min-height:145px}.listmode .tile{grid-template-columns:35px minmax(80px,1fr);gap:8px}.listmode .tile small{grid-column:2}.listmode .actions{grid-column:2}.mobilemenu{display:block}.navgroup{flex-direction:row}.sidebar.open{display:flex;position:absolute;z-index:5;top:69px;left:0;width:250px;box-shadow:10px 20px 35px #172a4525}}
</style></head><body><div class="shell"><header class="top"><button class="mobilemenu" id="menutoggle" aria-label="Toggle menu">☰</button><div class="brand"><span class="brandmark">◈</span> Alcuin Drive</div><div class="topsearch"><span style="color:#8c9bb0;font-size:18px">⌕</span><input id="search" placeholder="Search all your files..." aria-label="Search files"><button id="globalsearch">Search</button><button id="advancedtoggle" title="Advanced search">☷</button></div><div class="topright"><span>Private workspace</span><button id="logout" style="display:none">Sign out</button></div></header><aside class="sidebar" id="sidebar"><button class="primary newbutton" id="uploadbutton">＋ &nbsp; Upload files</button><div class="navgroup"><button class="active" id="navdrive"><span class="symbol">▣</span> My Drive</button><button id="navrecent"><span class="symbol">◷</span> Recent files</button><button id="navphotos"><span class="symbol">▧</span> Photos</button><button id="navdocs"><span class="symbol">▤</span> Documents</button></div><div class="sidefoot">PRIVATE CLOUD STORAGE<br>Powered by Cloudflare R2<br>Your files, your space.</div></aside><section id="login"><div class="brandmark" style="width:50px;height:50px">◈</div><h2>Welcome back</h2><p>Enter your password to access your private files.</p><form id="loginform"><input type="password" id="password" placeholder="Your drive password" autocomplete="current-password" required><button class="primary">Unlock my drive</button></form><p id="loginerror" role="alert"></p></section><main class="workspace" id="app" style="display:none"><div class="heading"><div><div class="eyebrow">PERSONAL CLOUD</div><h1 id="pagetitle">My Drive</h1><div class="subtitle">Everything you need, beautifully organized.</div></div><div class="head-actions"><button class="outline" id="newfolder">＋ New folder</button></div></div><div class="toolbar"><select id="type" aria-label="File type"><option value="">All file types</option><option value="image">Images</option><option value="video">Videos</option><option value="document">Documents</option><option value="other">Other files</option></select><select id="sort" aria-label="Sort"><option value="newest">Recently modified</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option><option value="size">Largest first</option></select><input id="from" type="date" title="Modified after"><input id="to" type="date" title="Modified before"><button class="outline" id="clear">Clear</button><div class="view"><button id="gridview" class="active" title="Grid view">▦</button><button id="listview" title="List view">☰</button></div></div><div class="advanced" id="advanced"><label>Latitude <input id="latitude" type="number" step="any" placeholder="e.g. 8.45"></label><label>Longitude <input id="longitude" type="number" step="any" placeholder="e.g. 125.12"></label><label>Radius (km) <input id="radius" type="number" min="1" max="20000" value="50"></label><label><input id="exif" type="checkbox"> Read photo EXIF</label></div><div class="breadcrumbs" id="crumbs"></div><div class="sectionhead"><h2 id="sectiontitle">Files and folders</h2><small id="filecount"></small></div><p id="notice" role="status"></p><input type="file" id="upload" multiple><div id="files" class="grid"></div><div id="more"></div></main></div><script>
let folder='',all=[],cursor='',loading=false;const $=id=>document.getElementById(id);
const api=async(path,options={})=>{const r=await fetch('/storage/api/'+path,{credentials:'same-origin',...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Request failed');return data};
const post=(path,obj)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
const note=s=>$('notice').textContent=s;
const bytes=n=>n===undefined?'':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const type=i=>i.folder?'📁':/\.(png|jpe?g|webp|gif|heic)$/i.test(i.name)?'🖼️':/\.(mp4|mov|webm)$/i.test(i.name)?'🎬':/\.pdf$/i.test(i.name)?'📄':'📦';
const category=i=>/\.(png|jpe?g|webp|gif|heic)$/i.test(i.name)?'image':/\.(mp4|mov|webm)$/i.test(i.name)?'video':/\.(pdf|txt|docx?|xlsx?|csv|pptx?)$/i.test(i.name)?'document':'other';
let viewMode='grid';function render(){const q=($('searchmode')?.value==='global'?'':$('search').value.toLowerCase()),t=$('type').value,sort=$('sort').value,from=$('from').value,to=$('to').value;let list=all.filter(i=>i.name.toLowerCase().includes(q)&&(!t||(!i.folder&&category(i)===t))&&(!from||i.modified?.slice(0,10)>=from)&&(!to||i.modified?.slice(0,10)<=to));list.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='size'?(b.size||0)-(a.size||0):sort==='oldest'?new Date(a.modified||0)-new Date(b.modified||0):new Date(b.modified||0)-new Date(a.modified||0));$('files').className=viewMode==='list'?'listmode':'grid';$('files').replaceChildren();$('filecount').textContent=list.length+' items';if(!list.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<div style="font-size:38px">▤</div><strong>Nothing here yet</strong><span>Upload a file or try adjusting your search.</span>';$('files').append(e)}for(const item of list){const tile=document.createElement('div');tile.className='tile';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=type(item);const name=document.createElement('div');name.className='name';name.textContent=item.name;const meta=document.createElement('small');meta.textContent=item.folder?'Folder':bytes(item.size)+' · '+(item.modified||'').slice(0,10)+(item.taken_at?' · Taken '+item.taken_at:'')+(item.distance_km!==undefined?' · '+item.distance_km+' km':'');const actions=document.createElement('div');actions.className='actions';const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)};if(item.folder){add('Open',()=>navigate(item.path))}else{if(/\.(jpg|jpeg|png|webp|gif|pdf)$/i.test(item.name))add('Preview',async()=>{try{const d=await api('preview-url?path='+encodeURIComponent(item.path));window.open(d.url,'_blank','noopener,noreferrer')}catch(e){note(e.message)}});add('Download',async()=>{try{const d=await api('download-url?path='+encodeURIComponent(item.path));location.href=d.url}catch(e){note(e.message)}})}add('Rename',async()=>{const name=prompt('New name',item.name);if(!name||name===item.name)return;const path=(item.path.includes('/')?item.path.slice(0,item.path.lastIndexOf('/')+1):'')+name;try{await post('move',{source:item.path,destination:path});await load()}catch(e){note(e.message)}});add('Delete',async()=>{if(!confirm('Delete '+item.name+'? This cannot be undone.'))return;try{await post('delete',{path:item.path});await load()}catch(e){note(e.message)}});tile.append(symbol,name,meta,actions);$('files').append(tile)}$('more').replaceChildren();if(cursor){const b=document.createElement('button');b.textContent='Load more';b.onclick=()=>load(true);$('more').append(b)}}
function crumbs(){const root=document.createElement('button');root.textContent='My Drive';root.onclick=()=>navigate('');$('crumbs').replaceChildren(root);let p='';for(const part of folder.split('/').filter(Boolean)){p+=(p?'/':'')+part;const dest=p;const span=document.createElement('span');span.textContent=' / ';const b=document.createElement('button');b.textContent=part;b.onclick=()=>navigate(dest);$('crumbs').append(span,b)}}
async function load(more=false){if(loading)return;loading=true;try{const d=await api('files?prefix='+encodeURIComponent(folder)+(more&&cursor?'&cursor='+encodeURIComponent(cursor):''));all=more?all.concat(d.items):d.items;cursor=d.next_cursor||'';render();crumbs();note('')}catch(e){note(e.message)}finally{loading=false}}
function navigate(p){folder=p;all=[];cursor='';$('pagetitle').textContent=p?p.split('/').pop():'My Drive';load()}
$('globalsearch').onclick=async()=>{try{note('Searching entire drive…');const params=new URLSearchParams({q:$('search').value,kind:$('type').value,start:$('from').value,end:$('to').value});if($('latitude').value&&$('longitude').value){params.set('lat',$('latitude').value);params.set('lon',$('longitude').value);params.set('radius_km',$('radius').value||'50')}if($('exif').checked)params.set('exif','true');const d=await api('search?'+params.toString());all=d.items;cursor='';folder='';$('pagetitle').textContent='Search results';render();$('crumbs').textContent='Entire drive search';note(d.truncated?'Results limited; narrow your search':'Found '+d.items.length+' matching files')}catch(e){note(e.message)}};
async function start(){const s=await api('status');$('login').style.display=s.authenticated?'none':'block';$('app').style.display=s.authenticated?'block':'none';$('logout').style.display=s.authenticated?'block':'none';if(s.authenticated)await load();if(!s.configured)$('loginerror').textContent='Storage needs configuration by the site owner.'}
$('loginform').onsubmit=async e=>{e.preventDefault();try{await post('login',{password:$('password').value});$('password').value='';$('loginerror').textContent='';await start()}catch(err){$('loginerror').textContent=err.message}};
$('logout').onclick=async()=>{await post('logout',{});location.reload()};
$('uploadbutton').onclick=()=>$('upload').click();
$('upload').onchange=async()=>{for(const f of $('upload').files){try{note('Uploading '+f.name+'…');const path=(folder?folder+'/':'')+f.name;const form=new FormData();form.append('path',path);form.append('file',f);const response=await fetch('/storage/api/upload',{method:'POST',credentials:'same-origin',body:form});if(!response.ok){const d=await response.json().catch(()=>({}));throw Error(d.detail||'Upload failed: '+response.status)}note('Uploaded '+f.name)}catch(e){note(e.message);break}}$('upload').value='';await load()};
$('newfolder').onclick=async()=>{const name=prompt('Folder name');if(!name)return;try{await post('folder',{path:(folder?folder+'/':'')+name});await load()}catch(e){note(e.message)}};
for(const id of ['type','sort','from','to'])$(id).addEventListener('input',render);
$('clear').onclick=()=>{for(const id of ['search','from','to','type'])$(id).value='';render()};
document.addEventListener('dragover',e=>{e.preventDefault();$('app').classList.add('drop')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('app').classList.remove('drop')});document.addEventListener('drop',e=>{e.preventDefault();$('app').classList.remove('drop');if(!$('app').offsetParent)return;const dt=new DataTransfer();for(const f of e.dataTransfer.files)dt.items.add(f);$('upload').files=dt.files;$('upload').dispatchEvent(new Event('change'))});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('globalsearch').click()});$('advancedtoggle').onclick=()=>$('advanced').classList.toggle('show');$('gridview').onclick=()=>{viewMode='grid';$('gridview').classList.add('active');$('listview').classList.remove('active');render()};$('listview').onclick=()=>{viewMode='list';$('listview').classList.add('active');$('gridview').classList.remove('active');render()};$('menutoggle').onclick=()=>$('sidebar').classList.toggle('open');$('navdrive').onclick=()=>navigate('');$('navrecent').onclick=()=>{$('search').value='';$('type').value='';$('sort').value='newest';$('globalsearch').click()};$('navphotos').onclick=()=>{$('search').value='';$('type').value='image';$('globalsearch').click()};$('navdocs').onclick=()=>{$('search').value='';$('type').value='document';$('globalsearch').click()};start().catch(e=>$('loginerror').textContent=e.message);
</script></body></html>
